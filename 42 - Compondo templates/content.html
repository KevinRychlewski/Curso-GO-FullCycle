{{template "header.html"}}
<h1>Cursos</h1>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Carga Horária</th>
            </tr>
        </thead>
        <tbody>
            {{ range . }}
                {{ if eq .CargaHoraria 40}}
                    <tr>
                        <td>{{ .Nome | ToUpper }}</td>
                        <td>{{ .CargaHoraria}}</td>
                    </tr>
                {{ end }}
            {{ end}}

        </tbody>
    </table>
</body>
{{template "footer.html"}}
